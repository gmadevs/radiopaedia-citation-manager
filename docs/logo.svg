<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 92 840 840" width="512" height="512" role="img" aria-label="Radiociter">
  <!-- Two quotation marks, and the lit point between them.
       Same family as the Radiouploader and Radiowriter marks: a midnight-blue
       rounded square, a grey shape, and one lit blue point. -->
  <defs>
    <radialGradient id="spark" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#8fe9ff"/>
      <stop offset="0.55" stop-color="#3fb4ff"/>
      <stop offset="1" stop-color="#1e8fff"/>
    </radialGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect x="92" y="92" width="840" height="840" rx="196" fill="#0d1f3c"/>
  <!-- the two quotation marks -->
  <g fill="#b7b9be" stroke="#b7b9be" stroke-width="1.1" stroke-linejoin="round">
    <path transform="translate(68 104) scale(34)" d="M6 17h3l2-4V7H5v6h3z"/>
    <path transform="translate(412 104) scale(34)" d="M6 17h3l2-4V7H5v6h3z"/>
  </g>
  <circle cx="512" cy="640" r="58" fill="#2aa5ff" opacity="0.55" filter="url(#glow)"/>
  <g fill="none" stroke="#35aaff" stroke-width="9" stroke-linecap="round" transform="translate(0 68)">
    <path d="M490 500 C492 482 480 472 484 452"/>
    <path d="M512 492 C518 470 504 456 512 430"/>
    <path d="M534 500 C532 482 544 472 540 452"/>
  </g>
  <circle cx="512" cy="640" r="45" fill="url(#spark)"/>
</svg>
